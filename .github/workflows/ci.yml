name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
      - run: repromut bench --smoke --out results/ci-smoke
      - name: Run full 452-case reproducibility benchmark
        run: repromut bench --out results/ci-full
      - name: Compare substantive results with frozen canonical run
        run: >-
          python results/crossplatform-macos-2026-11-09/compare.py
          results/dev-2026-11-08/cases.jsonl
          results/ci-full/cases.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            results/ci-smoke
            results/ci-full
