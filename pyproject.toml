[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "repromut"
version = "0.1.0.dev0"
description = "A controlled mutation benchmark for dynamic reproducibility testing of small ML experiments"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Hamjeth Misree" }]
keywords = ["reproducibility", "machine learning", "mutation testing", "benchmark", "research software"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Testing",
]
dependencies = ["numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3"]

[project.optional-dependencies]
test = ["pytest>=7", "hypothesis>=6"]

[project.scripts]
repromut = "repromut.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: full-catalog oracle checks (several seconds)"]
